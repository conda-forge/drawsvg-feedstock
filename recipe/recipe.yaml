schema_version: 1

context:
  name: drawSvg
  version: "2.5.1"
  python_min: "3.14"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/cduck/${{ name }}/archive/refs/tags/${{ version }}.tar.gz
  sha256: 75df000a4d293a845575ba641a4d626b55272ecfbf4d7f815f1af8aa10e9baa6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - drawsvg
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Library for programmatically generating SVG images
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/cduck/drawSvg

extra:
  recipe-maintainers:
    - thewchan
