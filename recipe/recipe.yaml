schema_version: 1

context:
  name: drawSvg
  version: "2.5.0"
  python_min: "3.14"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/cduck/${{ name }}/archive/refs/tags/${{ version }}.tar.gz
  sha256: b9e720d554c1d680e509108166760289c29d7c7cf8f7411008bcda7023209d90

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - drawsvg
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Library for programmatically generating SVG images
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/cduck/drawSvg

extra:
  recipe-maintainers:
    - thewchan
